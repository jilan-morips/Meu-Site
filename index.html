  async function buscarCidade(nome, lat, lon, idElemento) {
    const servidor = 'https://' + 'api' + '.open-meteo.com';
const url = servidor + '/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current_weather=true';


    try {
      const resposta = await fetch(url);
      const dados = await resposta.json();
            const temperatura = Math.round(dados.current_weather.temperature);
      const codigoClima = dados.current_weather.weathercode;
      const ehDia = dados.current_weather.is_day === 1;

      let icone = ehDia ? '☀️' : '🌙';
      if (codigoClima >= 1 && codigoClima <= 3) icone = ehDia ? '⛅' : '☁️';
      if (codigoClima >= 51) icone = '🌧️';

      const elTexto = document.getElementById(idElemento);
      if (elTexto) elTexto.textContent = `${icone} ${nome} agora: ${temperatura}°C`;
    } catch (erro) {
      const elTexto = document.getElementById(idElemento);
      if (elTexto) elTexto.textContent = `${nome}: indisponível`;
    }
  }

  function atualizarClima() {
    buscarCidade('Dores', -10.49, -37.19, 'clima-texto');
    buscarCidade('Aracaju', -10.94, -37.07, 'clima-aracaju');
  }

  atualizarClima();
</script>
</body>
</html>
