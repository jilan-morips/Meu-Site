  async function buscarCidade(nome, lat, lon, idElemento) {
            const u = new URL('https://' + ['api', 'open-meteo', 'com'].join('.'));
    u.pathname = '/v1/forecast';
    u.search = `latitude=${lat}&longitude=${lon}&current_weather=true`;
    const url = u.toString();


    try {
      const resposta = await fetch(url);
      const dados = await resposta.json();
      const temperatura = Math.round(dados.current_weather.temperature);
      const codigoClima = dados.current_weather.weathercode;
      const ehDia = dados.current_weather.is_day === 1;

      let icone = ehDia ? '☀️' : '🌙';
      if (codigoClima >= 1 && codigoClima <= 3) icone = ehDia ? '⛅' : '☁️';
      if (codigoClima >= 51) icone = '🌧️';

      const elTexto = document.getElementById(idElemento);
      if (elTexto) elTexto.textContent = `${icone} ${nome} agora: ${temperatura}°C`;
    } catch (erro) {
      const elTexto = document.getElementById(idElemento);
      if (elTexto) elTexto.textContent = `${nome}: indisponível`;
    }
  }

  async function carregar7Dias(nome, lat, lon) {

           const u = new URL('https://' + ['api', 'open-meteo', 'com'].join('.'));

        const nomeDia = i === 0 ? 'Hoje' : diasSemana[dataObj.getDay()];

        if (codigos[i] >= 1 && codigos[i] <= 3) icone = '⛅';
        if (codigos[i] >= 51) icone = '🌧️';

        html += `${icone} <b>${nomeDia}</b> (${partes[2]}/${partes[1]}): ${Math.round(mins[i])}° / ${Math.round(maxs[i])}°C<br>`;
      }
      painel.innerHTML = html;
    } catch (erro) {
      painel.innerHTML = 'Erro ao carregar previsão.';
    }
  }

  function selecionarCidade() {
    const select = document.getElementById('seletor-cidade');
    const idx = select.value;
    if (idx === '') return;
    const [nome, lat, lon] = cidadesSergipe[idx];
    buscarCidade(nome, lat, lon, 'clima-cidade-escolhida');
    cidadeAtual7Dias = { nome, lat, lon };
    const btn = document.querySelector('button[onclick="alternar7Dias()"]');
    if (btn) btn.textContent = `📅 Próximos 7 dias (${nome})`;
    const painel = document.getElementById('painel-7dias');
    if (painel && painel.style.display === 'block') {
      carregar7Dias(nome, lat, lon);
    }
  }

  function alternar7Dias() {
    const painel = document.getElementById('painel-7dias');
    if (!painel) return;
    if (painel.style.display === 'none') {
      painel.style.display = 'block';
      carregar7Dias(cidadeAtual7Dias.nome, cidadeAtual7Dias.lat, cidadeAtual7Dias.lon);
    } else {
      painel.style.display = 'none';
    }
  }

  function atualizarClima() {
    buscarCidade('Dores', -10.49, -37.19, 'clima-texto');
    buscarCidade('Aracaju', -10.94, -37.07, 'clima-aracaju');
  }

  preencherListaCidades();
  atualizarClima();
</script>

function irDireto(event) {
  if (event) event.preventDefault();
  const input = document.getElementById("termoDireto");
  let termo = input.value.trim();

  if (!termo) return;

  if (termo.includes(".") && !termo.includes(" ")) {
    if (!termo.startsWith("http://") && !termo.startsWith("https://")) {
      termo = "https://" + termo;
    }
    window.open(termo, "_blank");
  } else {
    const g1 = "https://www.google.com";
    const g2 = "/search?q=";
    const buscaGoogle = g1 + g2 + encodeURIComponent(termo);
    window.open(buscaGoogle, "_blank");
  }
}
